# Gaming Hub platforms (example)
#
# Copy this file to ~/.config/gaming_hub/platforms.ini and change it to match
# your emulators and game folders. Without that file the library shows only
# Steam games.
#
# One section per platform. The section name is the platform shown in the
# library ("Wii", "PS2"...). Every file in `folder` whose extension is in
# `extensions` becomes one game.
#
#   folder      the folder holding the game files (not its subfolders).
#               A leading ~/ means your home folder.
#   extensions  the file types to keep, separated by ; (case is ignored)
#   command     how to start a game; %f is replaced by the game's file
#               (used from milestone 7 step 8)
#   icon        the emulator's icon name from your icon theme
#               (usually its app id)
#
# The commands below are for the Flatpak versions of Dolphin, PCSX2 and
# PrimeHack from Flathub. The batch flags (-b, -batch) make the emulator
# close when the game is stopped, so the hub knows the game has ended.

[GameCube]
folder=~/Emulation/roms/gc
extensions=iso;rvz;gcm
command=flatpak run org.DolphinEmu.dolphin-emu -b -e %f
icon=org.DolphinEmu.dolphin-emu

[Wii]
folder=~/Emulation/roms/wii
extensions=iso;rvz;wbfs
command=flatpak run org.DolphinEmu.dolphin-emu -b -e %f
icon=org.DolphinEmu.dolphin-emu

[PS2]
folder=~/Emulation/roms/ps2
extensions=iso;chd
command=flatpak run net.pcsx2.PCSX2 -batch -fullscreen -- %f
icon=net.pcsx2.PCSX2

# A folder of its own for games that need another emulator
# (here the three Metroid Prime games, GameCube and Wii, in PrimeHack).
[PrimeHack]
folder=~/Emulation/ports/primehack
extensions=iso;rvz
command=flatpak run io.github.shiiion.primehack -b -e %f
icon=io.github.shiiion.primehack
